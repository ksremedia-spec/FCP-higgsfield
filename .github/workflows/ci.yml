name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: HiggsfieldKit tests (Linux, Swift 5.10)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: apt-get update -qq && apt-get install -y -qq libxml2-utils python3 >/dev/null
      - name: Fetch Apple's FCPXML 1.10 DTD
        run: python3 tools/fetch_fcpxml_dtd.py "$RUNNER_TEMP/fcpxml-1.10.dtd"
      - name: swift test
        env:
          FCPXML_DTD: ${{ runner.temp }}/fcpxml-1.10.dtd
        run: swift test

  macos:
    name: Tests + app/extension build (macOS, Xcode)
    runs-on: macos-15
    permissions:
      contents: write  # publishes UI snapshots to the ci/panel-snapshots branch
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Fetch Apple's FCPXML 1.10 DTD
        run: python3 tools/fetch_fcpxml_dtd.py "$RUNNER_TEMP/fcpxml-1.10.dtd"
      - name: swift test (HiggsfieldKit)
        env:
          FCPXML_DTD: ${{ runner.temp }}/fcpxml-1.10.dtd
          FCPXML_OUT: ${{ runner.temp }}/fcpxml-out
          PANEL_SNAPSHOTS: ${{ runner.temp }}/panel-snapshots
        run: swift test
      - name: swift build (all products, incl. HiggsfieldPanel)
        run: swift build
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec App/project.yml
      - name: Build container app + Final Cut Pro workflow extension
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project App/HiggsfieldFCP.xcodeproj \
            -scheme HiggsfieldFCP -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Verify bundle layout
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          test -d "$APP/Contents/PlugIns/HiggsfieldWorkflowExtension.appex"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APP/Contents/PlugIns/HiggsfieldWorkflowExtension.appex/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:ProExtensionPrincipalViewControllerClass" "$APP/Contents/PlugIns/HiggsfieldWorkflowExtension.appex/Contents/Info.plist"
          # Default personal build: no App Group or Keychain group.
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :HiggsfieldAppGroup' "$APP/Contents/Info.plist")"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :HiggsfieldKeychainGroup' "$APP/Contents/PlugIns/HiggsfieldWorkflowExtension.appex/Contents/Info.plist")"
      - name: Build an installable copy (personal config, signed to run locally)
        run: |
          set -o pipefail
          # Ad-hoc ("Sign to Run Locally") signature: enough for the app and
          # its sandboxed extension to run on the owner's Mac. The generated
          # Xcode project is packaged too, for building with a real team.
          xcodebuild -project App/HiggsfieldFCP.xcodeproj \
            -scheme HiggsfieldFCP -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/LocalDerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build | tee build/xcodebuild-local.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild-local.log
          APP=$(find build/LocalDerivedData/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict "$APP"
          mkdir -p build/dist
          ditto -c -k --keepParent "$APP" "build/dist/Higgsfield for Final Cut Pro.app.zip"
          ditto -c -k --keepParent App/HiggsfieldFCP.xcodeproj build/dist/HiggsfieldFCP.xcodeproj.zip
      - name: Upload installable app and Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: build/dist
          retention-days: 14
      - name: Build with the paid-team config (Local.xcconfig.example, ad-hoc signed)
        run: |
          set -o pipefail
          cp App/Config/Local.xcconfig.example App/Config/Local.xcconfig
          # Ad-hoc signing stands in for a real team so the entitlements are
          # processed and embedded; the groups use the example Team ID.
          xcodebuild -project App/HiggsfieldFCP.xcodeproj \
            -scheme HiggsfieldFCP -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/SharedDerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build | tee build/xcodebuild-shared.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          rm App/Config/Local.xcconfig
          grep -q "BUILD SUCCEEDED" build/xcodebuild-shared.log
          APP=$(find build/SharedDerivedData/Build/Products/Debug -maxdepth 1 -name "*.app" | head -1)
          EXT="$APP/Contents/PlugIns/HiggsfieldWorkflowExtension.appex"
          GROUP=ABCDE12345.com.ksremedia.HiggsfieldFCP
          for bundle in "$APP" "$EXT"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :HiggsfieldAppGroup' "$bundle/Contents/Info.plist")" = "$GROUP"
            test "$(/usr/libexec/PlistBuddy -c 'Print :HiggsfieldKeychainGroup' "$bundle/Contents/Info.plist")" = "$GROUP.shared"
            codesign -d --entitlements - --xml "$bundle" > build/entitlements.plist
            plutil -p build/entitlements.plist
            grep -q "<string>$GROUP</string>" build/entitlements.plist
            grep -q "<string>$GROUP.shared</string>" build/entitlements.plist
          done
          grep -q "com.apple.security.app-sandbox" build/entitlements.plist
      - name: Upload generated FCPXML samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcpxml-samples
          path: ${{ runner.temp }}/fcpxml-out
          if-no-files-found: ignore
      - name: Upload panel snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-snapshots
          path: ${{ runner.temp }}/panel-snapshots
          if-no-files-found: ignore
      - name: Publish panel snapshots to the ci/panel-snapshots branch
        if: github.event_name == 'push' && success()
        env:
          SNAPSHOTS: ${{ runner.temp }}/panel-snapshots
          TOKEN: ${{ github.token }}
        run: |
          [ -d "$SNAPSHOTS" ] || exit 0
          cd "$SNAPSHOTS"
          {
            echo "# Panel snapshots"
            echo
            echo "Rendered offscreen by \`PanelTests.testRenderPanelSnapshots\` on macOS CI for \`${GITHUB_SHA}\` (branch \`${GITHUB_REF_NAME}\`)."
            echo
            for f in *.png; do echo "## ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > README.md
          git init -q -b ci/panel-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Panel snapshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/panel-snapshots

  live-api:
    name: Live Higgsfield API check (read-only, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    env:
      HIGGSFIELD_ACCESS_TOKEN: ${{ secrets.HIGGSFIELD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require token
        run: |
          if [ -z "$HIGGSFIELD_ACCESS_TOKEN" ]; then
            echo "::warning::Set the HIGGSFIELD_ACCESS_TOKEN secret (output of 'hf auth token') to run the live check."
            exit 1
          fi
      - name: Build hfcp
        run: swift build --product hfcp
      - name: Account, catalog and schemas (no credits spent)
        run: |
          set -x
          .build/debug/hfcp balance
          .build/debug/hfcp workspaces
          .build/debug/hfcp catalog --type video | head -50
          .build/debug/hfcp catalog --chain
          for jt in reframe draw_to_video video_background_remover image_background_remover topaz_video bytedance_video_upscale bytedance_image_upscale seedance_2_0 kling_video_edit flux_3_video_edit seedance_2_5 nano_banana_flash nano_banana_pro; do
            .build/debug/hfcp schema "$jt" || true
          done
      - name: Cost estimates for each tool (no credits spent)
        run: |
          set -x
          .build/debug/hfcp cost generateVideo --prompt "slow dolly in on a lighthouse"
          .build/debug/hfcp cost generateImage --prompt "product shot"
          .build/debug/hfcp cost editVideo --prompt "make it snow" --duration 6
          .build/debug/hfcp cost reframe --duration 10 --set aspect_ratio=9:16 --set resolution=1080p
          .build/debug/hfcp cost removeBackground --duration 5
          .build/debug/hfcp cost upscale --model bytedance_video_upscale --duration 5 --width 1280 --height 720
          .build/debug/hfcp cost drawToEdit --prompt "make the jacket red" --duration 5
