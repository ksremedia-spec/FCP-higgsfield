# XcodeGen spec: `xcodegen generate --spec App/project.yml`
# Produces App/HiggsfieldFCP.xcodeproj with the container app and the
# Final Cut Pro workflow extension, both linking the local Swift package.
name: HiggsfieldFCP
options:
  bundleIdPrefix: com.ksremedia
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Set to an OAuth client ID issued to this app by Higgsfield to enable
    # built-in "Sign in with Higgsfield". Empty = CLI session / token only.
    HIGGSFIELD_OAUTH_CLIENT_ID: ""
    HIGGSFIELD_OAUTH_REDIRECT_URI: "http://127.0.0.1:8765/callback"
    # Signing, App Group and Keychain group live in Config/Signing.xcconfig
    # (personal by default; a paid team opts in with Config/Local.xcconfig).

packages:
  HiggsfieldFCP:
    path: ..

targets:
  HiggsfieldFCP:
    type: application
    platform: macOS
    sources:
      - path: HiggsfieldFCP
    dependencies:
      - package: HiggsfieldFCP
        product: HiggsfieldKit
      - package: HiggsfieldFCP
        product: HiggsfieldPanel
      - target: HiggsfieldWorkflowExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: "Higgsfield for Final Cut Pro"
        PRODUCT_BUNDLE_IDENTIFIER: $(HIGGSFIELD_BUNDLE_ID_PREFIX).HiggsfieldFCP
        # Personal: no entitlements. The app isn't sandboxed: it launches the
        # official Higgsfield CLI (`hf auth token`) and owns the shared folder.
        # Shared: adds the App Group and the Keychain group.
        CODE_SIGN_ENTITLEMENTS: HiggsfieldFCP/HiggsfieldFCP-$(HIGGSFIELD_ENTITLEMENTS_VARIANT).entitlements
        PRODUCT_MODULE_NAME: HiggsfieldFCPApp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: HiggsfieldFCP/Info.plist
      properties:
        CFBundleDisplayName: Higgsfield for Final Cut Pro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Personal Final Cut Pro workflow tool for the Higgsfield API."
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [higgsfieldfcp]
        # Lets Final Cut Pro's Share ▸ Export File "Open with" target this app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.image]
        HiggsfieldOAuthClientID: $(HIGGSFIELD_OAUTH_CLIENT_ID)
        HiggsfieldOAuthRedirectURI: $(HIGGSFIELD_OAUTH_REDIRECT_URI)
        HiggsfieldAppGroup: $(HIGGSFIELD_APP_GROUP)
        HiggsfieldKeychainGroup: $(HIGGSFIELD_KEYCHAIN_GROUP)

  HiggsfieldWorkflowExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: HiggsfieldWorkflowExtension
    dependencies:
      - package: HiggsfieldFCP
        product: HiggsfieldKit
      - package: HiggsfieldFCP
        product: HiggsfieldPanel
    configFiles:
      Debug: Config/WorkflowExtension.xcconfig
      Release: Config/WorkflowExtension.xcconfig
    settings:
      base:
        PRODUCT_NAME: HiggsfieldWorkflowExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(HIGGSFIELD_BUNDLE_ID_PREFIX).HiggsfieldFCP.WorkflowExtension
        PRODUCT_MODULE_NAME: HiggsfieldWorkflowExtension
        # Sandboxed, as Final Cut Pro requires. Both variants allow network
        # (client, plus a loopback server for OAuth), user-selected files and
        # bookmarks, and ~/Movies for results. Temporary exceptions, since an
        # FCPXML drag carries paths rather than sandbox extensions: read-only
        # /Volumes, the home folder (source media), /opt/homebrew and
        # /usr/local (the Higgsfield CLI); read-write the shared folder and the
        # CLI's own login. Shared adds the App Group and the Keychain group.
        CODE_SIGN_ENTITLEMENTS: HiggsfieldWorkflowExtension/HiggsfieldWorkflowExtension-$(HIGGSFIELD_ENTITLEMENTS_VARIANT).entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: HiggsfieldWorkflowExtension/Info.plist
      properties:
        CFBundleDisplayName: Higgsfield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Apple: "Building a Workflow Extension" — Info.plist keys.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinalCut.WorkflowExtension
          ProExtensionPrincipalViewControllerClass: HiggsfieldWorkflowExtensionViewController
          ProExtensionAttributes:
            ContentViewMinimumWidth: 360
            ContentViewMinimumHeight: 560
        HiggsfieldOAuthClientID: $(HIGGSFIELD_OAUTH_CLIENT_ID)
        HiggsfieldOAuthRedirectURI: $(HIGGSFIELD_OAUTH_REDIRECT_URI)
        HiggsfieldAppGroup: $(HIGGSFIELD_APP_GROUP)
        HiggsfieldKeychainGroup: $(HIGGSFIELD_KEYCHAIN_GROUP)
    postBuildScripts:
      - name: Embed ProExtensionHost.framework (when the Workflow Extension SDK is configured)
        script: |
          "${SRCROOT}/../scripts/embed-proextensionhost.sh"
        basedOnDependencyAnalysis: false

schemes:
  HiggsfieldFCP:
    build:
      targets:
        HiggsfieldFCP: all
        HiggsfieldWorkflowExtension: all
    run:
      config: Debug
    archive:
      config: Release
